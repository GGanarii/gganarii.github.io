<!DOCTYPE html>
<html lang="ko">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>GGanarii Games - Shock Wave</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
      background-color: #0f172a;
      color: #f8fafc;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 24px;
      text-align: center;
    }
    .container {
      max-width: 600px;
      background: #1e293b;
      padding: 40px 32px;
      border-radius: 16px;
      box-shadow: 0 10px 25px -5px rgba(0, 0, 0, 0.5), 0 8px 10px -6px rgba(0, 0, 0, 0.5);
      border: 1px solid #334155;
    }
    h1 {
      font-size: 2.2rem;
      margin-bottom: 12px;
      background: linear-gradient(135deg, #38bdf8, #818cf8);
      -webkit-background-clip: text;
      -webkit-text-fill-color: transparent;
    }
    p.subtitle {
      color: #94a3b8;
      font-size: 1.1rem;
      margin-bottom: 24px;
    }
    .badge {
      display: inline-block;
      background: #0284c7;
      color: white;
      font-size: 0.85rem;
      padding: 4px 12px;
      border-radius: 9999px;
      margin-bottom: 24px;
    }
    .links {
      display: flex;
      justify-content: center;
      gap: 16px;
      margin-top: 24px;
      flex-wrap: wrap;
    }
    .link-btn {
      color: #38bdf8;
      text-decoration: none;
      padding: 10px 18px;
      border: 1px solid #38bdf8;
      border-radius: 8px;
      font-size: 0.95rem;
      transition: all 0.2s ease;
    }
    .link-btn:hover {
      background: #38bdf8;
      color: #0f172a;
    }
    footer {
      margin-top: 36px;
      font-size: 0.85rem;
      color: #64748b;
    }
  </style>
</head>
<body>
  <div class="container">
    <div class="badge">GGanarii Official</div>
    <h1>Shock Wave</h1>
    <p class="subtitle">Experience thrilling gameplay on Android.</p>
    <div class="links">
      <a class="link-btn" href="app-ads.txt">app-ads.txt 확인</a>
      <a class="link-btn" href="mailto:seung589519@gmail.com">문의하기 (Support)</a>
    </div>
    <footer>
      &copy; 2026 GGanarii. All rights reserved.
    </footer>
  </div>
</body>
</html>
